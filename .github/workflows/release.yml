name: release-armv7

# 推送 v* 标签时自动：全流程交叉构建 → 发布 GitHub Release(镜像tar附件) → 推送 Docker Hub
# 手动触发：workflow_dispatch（不推送，仅构建验证）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 检出本工程
        uses: actions/checkout@v4

      - name: 读取版本基线（VERSION）
        id: ver
        run: |
          echo "port=$(sed -n 's/^PORT_VERSION=//p' VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          echo "base=$(sed -n 's/^UPSTREAM_BASE=//p' VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: 安装 pnpm
        run: npm install -g pnpm@10

      - name: QEMU（arm 用户态模拟）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: 全流程构建（前端打包 + Go 交叉编译 + buildx 镜像 + 导出 tar）
        env:
          # 锚定 VERSION 声明的上游 commit，保证 tag 与产物可复现
          UPSTREAM_REF: ${{ steps.ver.outputs.base }}
        run: ./build.sh

      - name: 登录 GHCR（内置 GITHUB_TOKEN，零配置）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送 GHCR（ghcr.io/<owner小写>/octotify-armv7）
        run: |
          PORT="${{ steps.ver.outputs.port }}"
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')"
          IMAGE="ghcr.io/${OWNER_LC}/octotify-armv7"
          docker tag octotify-armv7:latest "$IMAGE:latest"
          docker tag octotify-armv7:latest "$IMAGE:v${PORT}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:v${PORT}"
          echo "已发布: ${IMAGE}:v${PORT} (linux/arm/v7)"

      - name: 登录 Docker Hub（可选：需配置 DOCKERHUB_USERNAME/DOCKERHUB_TOKEN）
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 推送 Docker Hub（<用户名>/octotify-armv7:latest + v<版本>）
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        run: |
          PORT="${{ steps.ver.outputs.port }}"
          IMAGE="$DOCKERHUB_USERNAME/octotify-armv7"
          docker tag octotify-armv7:latest "$IMAGE:latest"
          docker tag octotify-armv7:latest "$IMAGE:v${PORT}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:v${PORT}"
          echo "已发布: ${IMAGE}:v${PORT} (linux/arm/v7)"

      - name: 发布 GitHub Release（镜像 tar 附件）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/octotify-armv7-*.tar
            out/octotify-armv7-*.tar.sha256
          body: |
            OctoTify ARMv7 v${{ steps.ver.outputs.port }}
            上游锚定: loommii/OctoTify@${{ steps.ver.outputs.base }} + patches/ 修复
            镜像: linux/arm/v7 · Docker Hub `${{ secrets.DOCKERHUB_USERNAME }}/octotify-armv7:v${{ steps.ver.outputs.port }}`
            设备端: docker load -i octotify-armv7-v*.tar && docker compose up -d
